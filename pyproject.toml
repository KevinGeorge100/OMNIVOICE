[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "omnivoice"
version = "0.1.0"
description = "Async, full-duplex enterprise telephony infrastructure"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "aiosqlite>=0.21,<1", "httpx>=0.28,<1", "websockets>=14,<16",
  "numpy>=1.26,<3", "faiss-cpu>=1.9,<2", "onnxruntime>=1.20,<2",
  "python-multipart>=0.0.20", "pypdf>=5,<7", "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.6,<1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[project.scripts]
omnivoice = "omnivoice.cli:main"

[tool.setuptools.packages.find]
include = ["omnivoice*"]

[tool.setuptools.package-data]
omnivoice = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
