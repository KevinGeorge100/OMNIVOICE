<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" role="img" aria-labelledby="title description">
  <title id="title">OmniVoice signal path</title>
  <desc id="description">A dark architectural banner showing a caller signal flowing through seven illuminated processing nodes toward outgoing audio.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d17"/>
      <stop offset="0.55" stop-color="#0e1727"/>
      <stop offset="1" stop-color="#07121b"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5aa6e9" stop-opacity="0.2"/>
      <stop offset="0.45" stop-color="#81d7f2"/>
      <stop offset="1" stop-color="#73e9b6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#35a9b1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#35a9b1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a4bdd4" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="330" rx="18" fill="url(#canvas)"/>
  <rect width="1280" height="330" rx="18" fill="url(#grid)"/>
  <ellipse cx="1040" cy="154" rx="285" ry="245" fill="url(#glow)"/>
  <path d="M44 42H1236M44 288H1236" stroke="#9db2c9" stroke-opacity="0.18"/>
  <path d="M44 42V288M1236 42V288" stroke="#9db2c9" stroke-opacity="0.18"/>
  <text x="74" y="80" fill="#91a9bc" font-size="12" font-family="Arial, Helvetica, sans-serif" letter-spacing="3.5">REAL-TIME TELEPHONY INFRASTRUCTURE</text>
  <text x="72" y="168" fill="#f4f8fb" font-size="69" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="-3.5">OMNIVOICE</text>
  <text x="75" y="202" fill="#b7c8d5" font-size="18" font-family="Arial, Helvetica, sans-serif">A live call. A responsive intelligence. One continuous signal.</text>
  <text x="75" y="266" fill="#73e9b6" font-size="12" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.1">PSTN  /  STREAMING  /  INTERRUPTIBLE  /  GROUNDED</text>
  <path d="M735 183C765 183 765 130 795 130S825 228 855 228 885 112 915 112 945 205 975 205 1005 146 1035 146 1065 183 1095 183H1198" fill="none" stroke="url(#signal)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M735 183H1198" fill="none" stroke="#acd6dd" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="3 7"/>
  <g fill="#0d1b27" stroke="#8fe7d5" stroke-width="2">
    <circle cx="795" cy="130" r="6"/><circle cx="855" cy="228" r="6"/>
    <circle cx="915" cy="112" r="6"/><circle cx="975" cy="205" r="6"/>
    <circle cx="1035" cy="146" r="6"/><circle cx="1095" cy="183" r="6"/>
  </g>
  <text x="738" y="267" fill="#819bb0" font-size="10" font-family="Arial, Helvetica, sans-serif" letter-spacing="2">INGRESS</text>
  <text x="1117" y="267" fill="#819bb0" font-size="10" font-family="Arial, Helvetica, sans-serif" letter-spacing="2">EGRESS</text>
</svg>
